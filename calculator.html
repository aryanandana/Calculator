<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="calculator">
        <div class="brand">amazon basics</div>
        <div class="model">112 STEPS CHECK & CORRECT</div>
         
        <div class="outer-box"></div>

        <div class="screen">

            <div class="one">01</div>
            <div class="two">123456789012</div>
        </div>
        <div class="three">12-DIGIT</div>
        <div class="four">555</div>
        <div class="inner-box"></div>
    
        <div class="button-first">
            <input type="button" value="CHECK" class="b1">
            <input type="button" value="CHECK" class="b1">
            <input type="button" value="CORRECT" class="b2">
            <input type="button" value="AUTO PLAY" class="b2">
            <input type="button" value="" class="b3">
        </div>

        <div class="button-second">
            <input type="button" value="RATE" class="b2">
            <input type="button" value="7" class="b4">
            <input type="button" value="8" class="b4">
            <input type="button" value="9" class="b4">
            <input type="button" value="" class="b2">
            <input type="button" value="%" class="b2">
            <input type="button" value="ON/C" class="b5">
            
        </div>

        <div class="button-three">
            <input type="button" value="-GST" class="b2">
            <input type="button" value="4" class="b4">
            <input type="button" value="5" class="b4">
            <input type="button" value="6" class="b4">
            <input type="button" value="*" class="b2">
            <input type="button" value="/" class="b2">
            <input type="button" value="MRC" class="b2">
            
        </div>

         <div class="button-four">
            <input type="button" value="+GST" class="b2">
            <input type="button" value="1" class="b4">
            <input type="button" value="2" class="b4">
            <input type="button" value="3" class="b4">
            
        </div>

        <div class="button-five">
            <input type="button" value="MU" class="b2">
            <input type="button" value="0" class="b4">
            <input type="button" value="00" class="b4">
            <input type="button" value="." class="b4">
            
        </div>  
        <div class="button-six">
            
        <input type="button" value="+" class="b6">
        </div>

        <div class="button-seven">
            <input type="button" value="-" class="b2">
            <input type="button" value="M-" class="b2">
        </div>

        <div class="button-eight">
            <input type="button" value="=" class="b2">
            <input type="button" value="M+" class="b2">
        </div>


    



















    </div>    

   
    
</body>
</html>
